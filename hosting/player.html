<!DOCTYPE html>
<html lang="en">
  <head>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background-color: black;
      }

      .embed-container iframe,
      .embed-container object,
      .embed-container embed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100% !important;
        height: 100% !important;
      }
    </style>
    <title>Reel Player</title>
  </head>

  <body>
    <div class="embed-container">
      <div id="player"></div>
    </div>

    <script>
      // Config comes from the query string rather than being templated
      // server-side, since this file is served as-is from a stable URL —
      // that's the whole point (a real https:// navigation sends a real
      // Referer header, which YouTube requires to authorize embedded
      // playback; a locally loaded page never does, however convincingly
      // its JS claims to be youtube.com).
      var query = new URLSearchParams(window.location.search);
      var playerId = query.get('playerId');
      var platform = query.get('platform');
      var playerVars = JSON.parse(query.get('playerVars'));

      var tag = document.createElement('script');
      tag.src = 'https://www.youtube.com/iframe_api';
      var firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

      var player;
      var timerId;

      function sendPlatformMessage(message) {
        switch (platform) {
          case 'android':
            window[playerId].postMessage(message);
            break;
          case 'ios':
            window[playerId].postMessage(message, '*');
            break;
        }
      }

      function sendMessage(key, data) {
        var message = {};
        message[key] = data;
        message['playerId'] = playerId;
        sendPlatformMessage(JSON.stringify(message));
      }

      function onYouTubeIframeAPIReady() {
        player = new YT.Player('player', {
          host: 'https://www.youtube.com',
          playerVars: playerVars,
          events: {
            onReady: function (event) {
              sendMessage('Ready', event);
            },
            onStateChange: function (event) {
              clearTimeout(timerId);
              sendMessage('StateChange', event.data);
              if (event.data == 1) {
                timerId = setInterval(function () {
                  sendMessage('VideoState', JSON.stringify({
                    currentTime: player.getCurrentTime(),
                    loadedFraction: player.getVideoLoadedFraction()
                  }));
                }, 100);
              }
            },
            onPlaybackQualityChange: function (event) {
              sendMessage('PlaybackQualityChange', event.data);
            },
            onPlaybackRateChange: function (event) {
              sendMessage('PlaybackRateChange', event.data);
            },
            onApiChange: function (event) {
              sendMessage('ApiChange', event.data);
            },
            onError: function (event) {
              sendMessage('PlayerError', event.data);
            },
            onAutoplayBlocked: function (event) {
              sendMessage('AutoplayBlocked', event.data);
            },
          },
        });
        player.setSize(window.innerWidth, window.innerHeight);
      }

      window.onresize = function () {
        if (player && player.setSize) player.setSize(window.innerWidth, window.innerHeight);
      };
    </script>
  </body>
</html>
